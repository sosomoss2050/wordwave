<meta charset="utf-8">
<title>WordWave 字浪</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// 语言自动检测：简体/繁体/日文/韩文/越南语/印尼语各回各家，其余默认英文版
(function () {
  var lang = (navigator.language || 'en').toLowerCase();
  var dest;
  if (lang.indexOf('zh') === 0) {
    dest = (lang.indexOf('hant') !== -1 || lang.indexOf('hk') !== -1 || lang.indexOf('tw') !== -1 || lang.indexOf('mo') !== -1) ? 'zh-hant/' : 'zh-hans/';
  } else if (lang.indexOf('ja') === 0) {
    dest = '';            // 日语用户进原版（根目录日文版由 upstream 维护，此处回退英文）
    dest = 'en/';
  } else if (lang.indexOf('ko') === 0) {
    dest = 'ko/';
  } else if (lang.indexOf('vi') === 0) {
    dest = 'vi/';
  } else if (lang.indexOf('id') === 0) {
    dest = 'id/';
  } else {
    dest = 'en/';
  }
  location.replace(dest + 'index.html');
})();
</script>
