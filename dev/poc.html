<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#222;color:#eee;font-size:12px}#log{white-space:pre-wrap;padding:8px}</style>
</head><body>
<div id="log">ready</div>
<script src="mp4-muxer.min.js"></script>
<script src="jizura.js"></script>
<script>
window.WW = {
  base(lyrics, over){
    const project = J.defaultProject();
    project.lyrics = lyrics;
    project.title = 'WordWave MV';
    if (over) for (const k of ['style','seed','aspect','res','fps']) if (over[k] != null) project[k] = over[k];
    this.project = project;
    this._audioBuf = null;
    this.plan = J.plan(project, null);
    return this.plan;
  },
  async loadAudio(dataB64, name){
    const bin = atob(dataB64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const file = new File([u8], name || 'song.mp3');
    this._audioBuf = await J.analyzeAudio(file);
    this.plan = J.plan(this.project, this._audioBuf);
    return { dur: this.plan.duration, cuts: this.plan.cuts.length, bpm: this._audioBuf.bpm, audioDur: this._audioBuf.duration, beats: this._audioBuf.beats.length };
  },
  async setup(lyrics, over, withAudio){
    let plan = this.base(lyrics, over || {});
    if (withAudio && this._audioBuf) plan = this.plan = J.plan(this.project, this._audioBuf);
    await J.ensureFonts(lyrics + (this.project.title||'') + '0123456789XYLINEREC:/.・【】No', null);
    return { dur: plan.duration, cuts: plan.cuts.length, W: plan.W, H: plan.H, fps: plan.fps, style: this.project.style, seed: this.project.seed };
  },
  async setupOmakase(lyrics, seed, withAudio){
    this.base(lyrics, { seed });
    const r = J.omakase(this.project, J.rng(seed), null);
    Object.assign(this.project, r);   // UI 层同款应用方式（12_ui.js:1120）
    this.plan = J.plan(this.project, (withAudio && this._audioBuf) ? this._audioBuf : null);
    await J.ensureFonts(lyrics + (this.project.title||'') + '0123456789XYLINEREC:/.・【】No', null);
    return { dur: this.plan.duration, cuts: this.plan.cuts.length, W: this.plan.W, H: this.plan.H, fps: this.plan.fps, style: this.project.style, seed };
  },
  async setupFromJson(lyrics, json, withAudio){
    this.base(lyrics, {});
    try { Object.assign(this.project, typeof json === 'string' ? JSON.parse(json) : json); } catch(e){}
    this.plan = J.plan(this.project, (withAudio && this._audioBuf) ? this._audioBuf : null);
    await J.ensureFonts(lyrics + (this.project.title||'') + '0123456789XYLINEREC:/.・【】No', null);
    return { dur: this.plan.duration, cuts: this.plan.cuts.length, W: this.plan.W, H: this.plan.H, fps: this.plan.fps, style: this.project.style };
  },
  dumpProject(){
    const p = Object.assign({}, this.project);
    delete p.lyrics;   // 歌词已在源文件里，避免重复存储大段文本
    return JSON.stringify(p, null, 2);
  },
  async export(quality){
    const buf = await J.exportMP4({ plan: this.plan, project: this.project, audio: this._audioBuf, quality: quality || 'high',
      onProgress: (p, msg) => { document.getElementById('log').textContent = msg; } });
    this._blob = buf.blob;
    // 挂下载链接：Playwright 走原生下载通道流式取片，大文件不走 b64 字符串
    this._dlUrl = URL.createObjectURL(this._blob);
    const a = document.createElement('a');
    a.id = 'ww-dl'; a.href = this._dlUrl; a.download = 'wordwave_output.mp4';
    document.body.appendChild(a);
    return { size: buf.size, tried: buf.tried || [], codec: buf.codec, audio: !!buf.audio };
  },
  dispose(){
    if (this._dlUrl) { URL.revokeObjectURL(this._dlUrl); this._dlUrl = null; }
    const a = document.getElementById('ww-dl'); if (a) a.remove();
  },
  shot(t, scale){
    scale = scale || 0.5;
    const c = document.createElement('canvas');
    c.width = Math.round(this.plan.W*scale); c.height = Math.round(this.plan.H*scale);
    const ctx = c.getContext('2d');
    new J.Renderer().frame(ctx, this.plan, t, { scale });
    return c.toDataURL('image/png');
  }
};
</script></body></html>
